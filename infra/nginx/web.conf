server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Lightweight liveness for docker healthcheck
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # SPA: try static files first, then fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed assets
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Never cache index.html — it pins the asset hashes
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
}
