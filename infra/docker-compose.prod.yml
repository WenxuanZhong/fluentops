# Production-grade compose for fluentops.
# IMPORTANT — before running:
#   1. Copy .env.prod.example to .env.prod and fill in every required value.
#   2. Provide TLS certs at infra/nginx/certs/{fullchain,privkey}.pem (or front this
#      stack with Cloudflare/ALB and use infra/nginx/edge.conf.example without TLS).
#   3. `docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build`
#
# Differences from infra/docker-compose.yml (dev):
#   - No host port exposure for postgres/redis/minio — internal network only.
#   - All credentials sourced from env, no defaults.
#   - api-gateway and web are built from this repo and live behind nginx edge proxy.

x-api-gateway-image: &api-gateway-image fluentops-api-gateway:${FLUENTOPS_IMAGE_TAG:-local}
x-api-gateway-build: &api-gateway-build
  context: ..
  dockerfile: apps/api-gateway/Dockerfile
x-web-image: &web-image fluentops-web:${FLUENTOPS_IMAGE_TAG:-local}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data
    volumes:
      - minio_data:/data
    networks: [internal, edge]

  minio-ready:
    image: ${CURL_IMAGE:-curlimages/curl:8.11.1}
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    command:
      - --retry
      - "90"
      - --retry-all-errors
      - --retry-delay
      - "2"
      - --max-time
      - "5"
      - -fsS
      - http://minio:9000/minio/health/live
    networks: [internal]

  migrate:
    image: *api-gateway-image
    build: *api-gateway-build
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command:
      - ./apps/api-gateway/node_modules/.bin/prisma
      - migrate
      - deploy
      - --schema
      - apps/api-gateway/prisma/schema.prisma
    networks: [internal]

  api-gateway:
    image: *api-gateway-image
    build: *api-gateway-build
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-ready:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      WS_TICKET_TTL: ${WS_TICKET_TTL:-60s}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-fluentops}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      AI_PROVIDER: ${AI_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      BILLING_PROVIDER: ${BILLING_PROVIDER}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY}
    networks: [internal, edge]

  web:
    image: *web-image
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    networks: [edge]

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/edge.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    networks: [edge]

volumes:
  pg_data:
    name: ${FLUENTOPS_VOLUME_PREFIX:-fluentops}_pg_data
  minio_data:
    name: ${FLUENTOPS_VOLUME_PREFIX:-fluentops}_minio_data

networks:
  internal:
  edge:
